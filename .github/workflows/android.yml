To complete your Android automation pipeline, let's look at how to handle securely signing your application and uploading it to Google Play Store internal tracks.
Because code signing requires secret keys, you must never hardcode credentials into your YAML file. Instead, you will use GitHub Secrets to pass your production keystore safely.

Production Pipeline Example (With Signing & Upload)

Add this configuration to the end of your workflow file to generate a signed Android App Bundle (.aab) and publish it:
yaml
    - name: Build Signed Release App Bundle
      run: ./gradlew bundleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload to Google Play Internal Track
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.yourcompany.yourapp
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: internal
Use code with caution.

🔒 Required GitHub Secrets

To make this work, navigate to your repository's Settings > Secrets and variables > Actions and add:
• KEYSTORE_PASSWORD: The password to your production keystore file.
• KEY_ALIAS: The specific alias name inside your keystore.
• KEY_PASSWORD: The password for your key alias.
• PLAY_SERVICE_ACCOUNT_JSON: The API access JSON credentials generated from your Google Play Console account.
