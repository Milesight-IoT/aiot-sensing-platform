To get your Google Play service account JSON key ready for GitHub Secrets, you need to link your Google Cloud Platform (GCP) console to your Google Play Console.
Here are the precise steps to generate and retrieve that credential file:

Step 1: Create a Service Account in Google Cloud

1. Open the Google Cloud Console (IAM & Admin).
2. Select the GCP project linked to your Google Play Console apps (or create a new one).
3. Click Create Service Account at the top.
4. Provide a name (e.g., github-actions-publisher) and click Create and Continue.
5. Assign the role Service Account User (or leave roles blank, as permissions will be handled on the Play Console side) and click Done.

Step 2: Generate the JSON Key File

1. In the Service Accounts list, click on the Email address of the service account you just created.
2. Navigate to the Keys tab.
3. Click Add Key > Create new key.
4. Select JSON as the key type and click Create.
5. A .json file will automatically download to your computer. Keep this file secure, as it contains absolute access keys to your app distribution channels.

Step 3: Grant Access in Google Play Console

1. Log into your Google Play Console.
2. Go to Users and permissions in the left sidebar menu.
3. Click Invite new users.
4. Paste the Email address of your Google Cloud service account.
5. Go to the App permissions tab, add your specific app, and grant it permissions to Create and edit draft apps and Manage testing tracks.
6. Click Invite user.

Step 4: Add to GitHub

1. Open your downloaded .json file in a text editor and copy the entire text block.
2. Go to your GitHub repository > Settings > Secrets and variables > Actions.
3. Create a new repository secret named PLAY_SERVICE_ACCOUNT_JSON and paste the exact text block content as the secret value.
