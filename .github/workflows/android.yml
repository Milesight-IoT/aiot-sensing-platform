Recommended Workflow Improvements

1. Upgrade Deprecated Actions: Versions v1 through v4 of actions/setup-java are deprecated. You should transition your workflow to use actions/setup-java@v6, which resolves modern runner download issues. Similarly, actions/checkout@v6 is now available and introduces better credential security controls. [1] (https://github.com/actions/setup-java), [2] (https://github.com/marketplace/actions/setup-java-jdk), [3] (https://www.reddit.com/r/devops/comments/1x52qgg/github_actions_selfhosted_runner_gets_stuck/), [4] (https://github.com/actions/checkout/blob/main/README.md?plain=1)
2. Consider a Modern Java Version: Android development has largely shifted toward modern runtimes. If your project supports it, consider changing java-version: '11' to a newer long-term support (LTS) release like '17' or '21'. [1] (https://dev.to/rohithv07/automating-java-builds-with-github-actions-4c0m), [2] (https://github.com/marketplace/actions/setup-java-jdk)
