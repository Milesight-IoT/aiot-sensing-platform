      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # 8. Generate the Production Release Android App Bundle (.aab)
    # Ensure your project's build.gradle is configured to ingest these env variables
    - name: Build Signed Release App Bundle
      run: ./gradlew bundleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    # 9. Deploy the production bundle seamlessly to the Google Play Internal Track
    - name: Upload to Google Play Internal Track
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.yourcompany.yourapp  # Replace with your actual application package ID
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: internal
