name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code
    - name: Checkout repository
      uses: actions/checkout@v6

    # 2. Initialize the modern Java environment with automatic Gradle caching
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Secure necessary execution permissions for the Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Perform static code analysis to catch bugs early
    - name: Run Android Lint
      run: ./gradlew lintDebug

    # 5. Run local JUnit unit tests
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # 6. Assemble an un-signed Debug APK for manual internal testing
